name: Otomatis Update Expo (OTA)

on:
  push:
    branches:
      - main # (Ganti menjadi 'master' jika branch utamamu bernama master)

jobs:
  update:
    name: Publish EAS Update
    runs-on: ubuntu-latest
    steps:
      - name: 1. Ambil kode terbaru dari GitHub
        uses: actions/checkout@v4

      - name: 2. Siapkan lingkungan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Siapkan Expo CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 4. Install dependencies (NPM)
        run: npm install

      - name: 5. Kirim Update ke HP Pengguna! 🚀
        env:
          COMMIT_MSG: "${{ github.event.head_commit.message }}"
        run: |
          eas update --branch preview --message "Update otomatis dari GitHub: $COMMIT_MSG"
